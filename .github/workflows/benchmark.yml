name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@openomni/protocol

      - name: Bench (session)
        run: bun run bench
        working-directory: packages/session

      - name: Bench (agent)
        run: bun run bench
        working-directory: packages/agent

      - name: Bench (openomni)
        run: bun run bench
        working-directory: packages/openomni

      - name: Combine results
        run: |
          mkdir -p bench-results
          combined="[]"
          for f in packages/*/bench-results/*.json; do
            if [ -f "$f" ]; then
              combined=$(echo "$combined" | bun -e "
                const existing = JSON.parse(await Bun.stdin.text());
                const added = JSON.parse(await Bun.file('$f').text());
                console.log(JSON.stringify([...existing, ...added]));
              ")
            fi
          done
          echo "$combined" > bench-results/combined.json

      - name: Check gh-pages exists
        id: ghp
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap gh-pages branch
        if: steps.ghp.outputs.exists == 'false' && github.event_name == 'push'
        run: |
          git checkout --orphan gh-pages
          git reset --hard
          mkdir -p dev/bench
          echo '[]' > dev/bench/data.js
          git add dev/bench/data.js
          git -c user.name="github-actions" -c user.email="github-actions@github.com" commit -m "chore: bootstrap gh-pages for benchmarks"
          git push origin gh-pages
          git checkout -

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        if: steps.ghp.outputs.exists == 'true' || github.event_name == 'push'
        with:
          name: OpenOmni Benchmarks
          tool: customSmallerIsBetter
          output-file-path: bench-results/combined.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: "150%"
          comment-on-alert: ${{ github.event_name == 'push' }}
          fail-on-alert: false
          summary-always: true
