name: Benchmark

# The regression gate lives in the `publish` job, which only runs on
# main / workflow_dispatch. On a PR the 15-minute benchmark ran but could
# never fail the check (publish is skipped), so it was pure theater. Run it
# only where it can actually gate: main pushes and manual dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runs:
        description: Number of repeated benchmark runs to summarize
        required: false
        default: "5"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@openomni/protocol

      - name: Run repeated benchmarks
        env:
          BENCHMARK_RUNS: ${{ github.event.inputs.runs || '5' }}
        run: |
          set -euo pipefail
          rm -rf bench-results packages/*/bench-results
          mkdir -p bench-results/runs

          for run in $(seq 1 "$BENCHMARK_RUNS"); do
            echo "Benchmark run $run/$BENCHMARK_RUNS"
            rm -rf packages/*/bench-results

            bun run --cwd packages/ledger bench
            bun run --cwd packages/agent bench
            mkdir -p "bench-results/runs/$run"
            cp packages/ledger/bench-results/session.json "bench-results/runs/$run/session.json"
            cp packages/agent/bench-results/agent.json "bench-results/runs/$run/agent.json"
          done

      # RSS-delta leak guards: absolute-MB assertions after Bun.gc are too
      # noisy for the blocking Test job (RSS includes JIT/allocator pages GC
      # never returns), so they live here, off the PR-required path. The file
      # is named *.bench.ts so `bun test` auto-discovery in the Test job skips
      # it; it only runs when pointed at explicitly.
      - name: Memory regression guards (informational)
        run: bun test ./packages/ledger/test/bench/memory-regression.bench.ts

      - name: Summarize benchmark runs
        run: bun run script/summarize-benchmark-runs.ts

      - name: Publish benchmark summary
        run: cat bench-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: bench-results/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish benchmark history
    needs: benchmark
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Download benchmark results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: benchmark-results
          path: bench-results

      - name: Check gh-pages exists
        id: ghp
        run: |
          set +e
          git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 2 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::git ls-remote failed with exit code $rc"
            exit 1
          fi

      - name: Bootstrap gh-pages branch
        if: steps.ghp.outputs.exists == 'false' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        run: |
          git checkout --orphan gh-pages
          git reset --hard
          mkdir -p dev/bench
          echo '[]' > dev/bench/data.js
          git add dev/bench/data.js
          git -c user.name="github-actions" -c user.email="github-actions@github.com" commit -m "chore: bootstrap gh-pages for benchmarks"
          git push origin gh-pages
          git checkout -

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: OpenOmni Benchmarks
          tool: customSmallerIsBetter
          output-file-path: bench-results/combined.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: "150%"
          comment-on-alert: true
          fail-on-alert: ${{ steps.ghp.outputs.exists == 'true' }}
          summary-always: true
