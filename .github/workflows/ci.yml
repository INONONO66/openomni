name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  static:
    name: Static Analysis (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        task: [lint, check-types]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@openomni/protocol
      - run: bunx turbo run ${{ matrix.task }}

  deps:
    name: Dependency Rules
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run script/check-deps.ts
      - run: bun run lint:guards
      - run: bun run lint:side-effects
      - run: bunx turbo run build --filter=@openomni/protocol
      - run: bun run lint:tools
      - run: bun run lint:tools --self-test

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [static, deps]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build
      - name: Test (session)
        run: bun test
        working-directory: packages/session
      - name: Test (llm)
        run: bun test
        working-directory: packages/llm
      - name: Test (agent)
        run: bun run test:ci
        working-directory: packages/agent
      - name: Test (protocol)
        run: bun test
        working-directory: packages/protocol
      - name: Test (openomni)
        run: bun run test:ci
        working-directory: packages/openomni
      - name: Test (coordinator)
        run: bun test
        working-directory: packages/coordinator
      - name: Test (server)
        run: bun test
        working-directory: apps/server
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: packages/*/coverage/
          if-no-files-found: ignore
