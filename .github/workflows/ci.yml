name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: CI Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      verify: ${{ steps.select.outputs.verify }}
      matrix: ${{ steps.select.outputs.matrix }}
      dependencyReview: ${{ steps.select.outputs.dependencyReview }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            bun run script/ci-plan.ts --base "$BASE" --head "$HEAD" > ci-plan.json
          else
            bun run script/ci-plan.ts --full > ci-plan.json
          fi
          echo "plan=$(jq -c . ci-plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-plan
          path: ci-plan.json
          retention-days: 14
          if-no-files-found: warn

  prepare:
    name: Build
    needs: [plan]
    if: needs.plan.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - run: bun run ci build
      - run: bun run ci pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-dist
          path: workspace-dist.tar
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency Review
    needs: [plan]
    if: github.event_name == 'pull_request' && needs.plan.outputs.dependencyReview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  static:
    name: Static Analysis (${{ matrix.task }})
    needs: [plan, prepare]
    if: needs.plan.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        task: [lint, check-types]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-dist
      - run: bun run ci restore
      - if: matrix.task == 'check-types'
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
        run: bun run ci:check-types
      - if: matrix.task == 'lint'
        run: |
          bun run lint:docs
          bunx ultracite@7.8.3 check --formatter-enabled=false .

  deps:
    name: Dependency Rules
    needs: [plan, prepare]
    if: needs.plan.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-dist
      - run: bun run ci restore
      - run: bun run script/check-topology.ts
      - run: bun run script/check-deps.ts
      - run: bun run lint:guards
      - run: bun run lint:side-effects
      - run: bun run lint:tools
      - run: bun run lint:tools --self-test

  tests:
    name: Test (${{ matrix.key }})
    needs: [plan, prepare]
    if: needs.plan.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-dist
      - run: bun run ci restore
      # topology:test-steps:start — generated by script/topology.ts
      - name: Test (protocol)
        if: matrix.key == 'protocol'
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/protocol
      - name: Test (ipc)
        if: matrix.key == 'ipc'
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/ipc
      - name: Test (ledger)
        if: matrix.key == 'ledger'
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/ledger
      - name: Test (policy)
        if: matrix.key == 'policy'
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/policy
      - name: Test (llm)
        if: matrix.key == 'llm'
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/llm
      - name: Test (agent)
        if: matrix.key == 'agent'
        run: bun run test:ci
        working-directory: packages/agent
      - name: Test (machines)
        if: matrix.key == 'machines'
        run: bun test --timeout 15000
        working-directory: packages/machines
      - name: Test (codemode)
        if: matrix.key == 'codemode'
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/codemode
      - name: Test (channels)
        if: matrix.key == 'channels'
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/channels
      - name: Test (openomni app)
        if: matrix.key == 'openomniApp'
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: apps/openomni
      - name: Test (ui design system)
        if: matrix.key == 'ui'
        run: bun test --timeout 15000
        working-directory: packages/ui
      - name: Test (desktop app)
        if: matrix.key == 'desktopApp'
        run: bun test --timeout 15000
        working-directory: apps/desktop
      - name: Test (scripts)
        if: matrix.key == 'scripts'
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: script
      # topology:test-steps:end
      - name: Coverage ratchet
        if: matrix.coverage
        env:
          LANE: ${{ matrix.dir }}
        run: bun run script/check-coverage-ratchet.ts --lane "$LANE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-${{ matrix.key }}
          path: |
            packages/*/coverage/
            apps/*/coverage/
            script/coverage/
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Quality
    needs: [plan, prepare]
    if: needs.plan.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-dist
      - run: bun run ci restore
      - name: Ratchet self-tests (discrimination bench)
        run: |
          bun run script/check-coverage-ratchet.ts --self-test
          bun run script/check-dead-exports.ts --self-test
          bun run script/check-import-cycles.ts --self-test
          bun run script/check-deps.ts --self-test
      - run: bun run script/check-dead-exports.ts
      - run: bun run script/check-import-cycles.ts
      - run: bun run script/verify-tsconfig-inheritance.ts
      - run: bun run script/verify-ledger-rename.ts
      - run: bun run script/check-ledger-schema-drift.ts
      - run: bun run script/report-source-metrics.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: source-metrics
          path: source-metrics.json
          if-no-files-found: warn
          retention-days: 14

  test:
    name: Test
    needs: [plan, prepare, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - run: bun run ci test-gate
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}

  ci:
    name: CI
    needs: [plan, prepare, tests, static, deps, quality, dependency-review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - run: bun run ci gate
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EVENT: ${{ github.event_name }}
