name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  static:
    name: Static Analysis (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        task: [lint, check-types]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@openomni/protocol
      - run: bunx turbo run ${{ matrix.task }}
      # script/ lives outside turbo's package graph — typecheck it explicitly
      # (needs the protocol dist built above).
      - if: matrix.task == 'check-types'
        run: bunx tsc -p script/tsconfig.json

  deps:
    name: Dependency Rules
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run script/check-deps.ts
      - run: bun run lint:guards
      - run: bun run lint:side-effects
      - run: bunx turbo run build --filter=@openomni/protocol
      - run: bun run lint:tools
      - run: bun run lint:tools --self-test

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [static, deps]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build
      - name: Test (telemetry)
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/telemetry
      - name: Test (session)
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/session
      - name: Test (llm)
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/llm
      - name: Test (policy)
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/policy
      - name: Test (agent)
        run: bun run test:ci
        working-directory: packages/agent
      - name: Test (protocol)
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/protocol
      - name: Test (ipc)
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/ipc
      - name: Test (openomni)
        run: bun run test:ci
        working-directory: packages/openomni
      - name: Test (coordinator)
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/coordinator
      - name: Test (server)
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: apps/server
      - name: Test (conformance)
        run: bun test --timeout 15000 script/conformance
      - name: Test (tsconfig inheritance verifier)
        run: bun test --timeout 15000 script/verify-tsconfig-inheritance.test.ts
      - name: Coverage ratchet
        run: bun run script/check-coverage-ratchet.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: |
            packages/*/coverage/
            apps/*/coverage/
          if-no-files-found: ignore

  smoke-dist:
    name: Dist Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build:dist
      - run: bun run smoke:dist

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build
      - name: Ratchet self-tests (discrimination bench)
        run: |
          bun run script/check-coverage-ratchet.ts --self-test
          bun run script/check-dead-exports.ts --self-test
          bun run script/check-import-cycles.ts --self-test
          bun run script/check-deps.ts --self-test
      - run: bun run script/check-dead-exports.ts
      - run: bun run script/check-import-cycles.ts
      - run: bun run script/verify-tsconfig-inheritance.ts
      - run: bun run script/check-ledger-schema-drift.ts
      - run: bun run script/report-source-metrics.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-metrics
          path: source-metrics.json
