name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static Analysis (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        task: [lint, check-types]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@openomni/protocol
      - run: bunx turbo run ${{ matrix.task }}

  deps:
    name: Dependency Rules
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run script/check-deps.ts

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [static, deps]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build
      - name: Test (session)
        run: bun test
        working-directory: packages/session
      - name: Test (llm)
        run: bun test
        working-directory: packages/llm
      - name: Test (agent)
        run: bun run test:ci
        working-directory: packages/agent
      - name: Test (protocol)
        run: bun test
        working-directory: packages/protocol
      - name: Test (openomni)
        run: bun run test:ci
        working-directory: packages/openomni
      - name: Test (coordinator)
        run: bun test
        working-directory: packages/coordinator
      - name: Test (server)
        run: bun test
        working-directory: apps/server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: packages/*/coverage/
          if-no-files-found: ignore
