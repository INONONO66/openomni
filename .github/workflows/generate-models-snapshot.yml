name: Refresh models snapshot

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate snapshot patch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.6"
      - name: Regenerate snapshot
        run: bun run script/generate-models-snapshot.ts
      - name: Format
        run: bun run format
      - name: Upload snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: models-snapshot
          path: packages/llm/src/model/models-snapshot.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Open snapshot PR
    needs: generate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: models-snapshot
          path: packages/llm/src/model
      - name: Open PR if snapshot changed
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          commit-message: "chore(llm): refresh models-snapshot.json from models.dev"
          branch: chore/refresh-models-snapshot
          delete-branch: true
          title: "chore(llm): refresh models-snapshot.json"
          body: |
            Automated weekly refresh of `packages/llm/src/model/models-snapshot.json`
            from https://models.dev/api.json.

            Run locally: `bun run script/generate-models-snapshot.ts`
          labels: dependencies
