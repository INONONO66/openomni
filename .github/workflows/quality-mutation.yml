name: quality-mutation

on:
  schedule:
    - cron: '41 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: Full mutation campaign
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install frozen analyzer tools
        run: |
          python -m pip install --requirement script/conformance/quality-python-requirements.txt
          echo "D945_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
      - run: bun run build
      - run: bun run script/check-quality-python.ts
      - name: Execute complete campaign and enforce measured baseline
        run: bun run script/quality-native-mutation.ts --base origin/main --baseline script/conformance/quality-baseline-mutation.json
      - name: Preserve complete or failed campaign evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-mutation-receipt
          path: quality-mutation-results/
          if-no-files-found: warn
          retention-days: 14
