[test]
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "./coverage"
coverageSkipTestFiles = true

# Keep compiled dist/ copies out of test discovery so `bun test` from the repo
# root never double-executes stale `dist/**/*.test.js`. Effective on bun
# >= 1.3.11 (the pinned 1.3.6 silently ignores this key, and per-package cwd
# runs don't read the root bunfig) — the load-bearing guard is build-side:
# every package builds via tsconfig.build.json, which excludes `**/*.test.ts`
# from emit, after an `rm -rf dist` clean step.
pathIgnorePatterns = ["**/dist/**"]
