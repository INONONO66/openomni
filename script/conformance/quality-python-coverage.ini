# coverage.py configuration for the Python analyzers' self-tests, run from the
# script/ directory by `ci test --lane scripts-tooling-1`. Every interpreter the
# tests spawn is measured through the subprocess patch, so the combined LCOV
# carries the collector's own run-mode lines; the sys.monitoring core leaves
# sys.settrace to the collector under measurement. Paths are relative to
# script/ so the records join the lane's Bun LCOV under the same roots; the
# include list is the production Python under script/, never its tests.
[run]
core = sysmon
patch = subprocess, _exit
parallel = true
data_file = coverage/python/.coverage
relative_files = true
disable_warnings = no-data-collected
include =
    */script/quality-census/python-provenance.py
    */script/quality-coverage/python.py
    */script/quality-metrics/python.py
    */script/quality-mutation/python-engine.py

[lcov]
line_checksums = false
